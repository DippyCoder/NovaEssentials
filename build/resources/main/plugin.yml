name: NovaEssentials
version: '1.1.0'
main: com.dippycoder.novaEssentials.NovaEssentials
api-version: '1.21'
load: POSTWORLD
authors: [ DippyCoder ]
description: A feature-rich essentials plugin for Paper servers.
softdepend: [ PlaceholderAPI, Vault ]

commands:
  gm:
    description: Change your or another player's gamemode.
    usage: /gm <mode> [player]
    aliases: [ gamemode ]
    permission: novaess.cmd.gm
  msg:
    description: Send a private message to a player.
    usage: /msg <player> <message>
    aliases: [ tell, whisper, w ]
    permission: novaess.cmd.msg
  r:
    description: Reply to the last private message.
    usage: /r <message>
    aliases: [ reply ]
    permission: novaess.cmd.msg
  vanish:
    description: Toggle vanish mode.
    usage: /vanish [player]
    aliases: [ v ]
    permission: novaess.cmd.vanish
  fly:
    description: Toggle flight mode.
    usage: /fly [player]
    permission: novaess.cmd.fly
  speed:
    description: Set movement or fly speed.
    usage: /speed <0-10> [player]
    permission: novaess.cmd.speed
  enchant:
    description: Enchant the item in your hand.
    usage: /enchant <enchantment> [level]
    aliases: [ ench ]
    permission: novaess.cmd.enchant
  heal:
    description: Restore health to full.
    usage: /heal [player]
    permission: novaess.cmd.heal
  feed:
    description: Restore hunger to full.
    usage: /feed [player]
    permission: novaess.cmd.feed
  god:
    description: Toggle god mode.
    usage: /god [player]
    permission: novaess.cmd.god
  invsee:
    description: View another player's inventory.
    usage: /invsee <player>
    permission: novaess.cmd.invsee
  ec:
    description: Open an ender chest.
    usage: /ec [player]
    aliases: [ enderchest ]
    permission: novaess.cmd.ec
  workbench:
    description: Open a crafting table.
    usage: /workbench [player]
    aliases: [ craft, wb ]
    permission: novaess.cmd.workbench
  anvil:
    description: Open an anvil.
    usage: /anvil [player]
    aliases: [ anv ]
    permission: novaess.cmd.anvil
  sudo:
    description: Execute a command or message as another player.
    usage: /sudo <player> <message|/command>
    permission: novaess.cmd.sudo
  tpa:
    description: Send a teleport request to a player.
    usage: /tpa <player>
    permission: novaess.cmd.tpa
  tpaccept:
    description: Accept a pending teleport request.
    usage: /tpaccept
    permission: novaess.cmd.tpaccept
  tpdeny:
    description: Deny a pending teleport request.
    usage: /tpdeny
    permission: novaess.cmd.tpdeny
  tpahere:
    description: Request a player to teleport to you.
    usage: /tpahere <player>
    aliases: [ tphere ]
    permission: novaess.cmd.tpahere
  tpall:
    description: Teleport all players to your location.
    usage: /tpall
    permission: novaess.cmd.tpall
  back:
    description: Teleport to your last death location.
    usage: /back
    permission: novaess.cmd.back
  block:
    description: Block or unblock a player.
    usage: /block <player>
    permission: novaess.cmd.block
  home:
    description: Teleport to your home.
    usage: /home [name|list]
    permission: novaess.cmd.home
  sethome:
    description: Set your home location.
    usage: /sethome [name]
    permission: novaess.cmd.sethome
  delhome:
    description: Delete a home.
    usage: /delhome <name>
    permission: novaess.cmd.delhome
  spawn:
    description: Teleport to spawn.
    usage: /spawn
    permission: novaess.cmd.spawn
  setspawn:
    description: Set the spawn location.
    usage: /setspawn
    permission: novaess.cmd.setspawn
  warp:
    description: Teleport to a warp or list all warps.
    usage: /warp <name|list>
    permission: novaess.cmd.warp
  setwarp:
    description: Set a warp location.
    usage: /setwarp <name>
    permission: novaess.cmd.setwarp
  delwarp:
    description: Delete a warp.
    usage: /delwarp <name>
    permission: novaess.cmd.delwarp
  time:
    description: Set the world time.
    usage: /time <day|night|noon|midnight|value>
    aliases: [ day, night, noon, midnight ]
    permission: novaess.cmd.time
  kit:
    description: Receive a kit or list available kits.
    usage: /kit [name]
    permission: novaess.cmd.kit
  broadcast:
    description: Broadcast a message to all players.
    usage: /broadcast <message>
    aliases: [ bc ]
    permission: novaess.cmd.broadcast
  chat:
    description: Pause or unpause the chat.
    usage: /chat <pause|unpause> [duration]
    permission: novaess.cmd.chat
  mute:
    description: Mute a player.
    usage: /mute <player> [duration] [reason]
    permission: novaess.cmd.mute
  unmute:
    description: Unmute a player.
    usage: /unmute <player>
    permission: novaess.cmd.unmute
  kick:
    description: Kick a player from the server.
    usage: /kick <player> [reason]
    permission: novaess.cmd.kick
  ban:
    description: Ban a player from the server.
    usage: /ban <player> <duration|perm> [reason]
    permission: novaess.cmd.ban
  unban:
    description: Unban a player.
    usage: /unban <player>
    permission: novaess.cmd.unban
  afk:
    description: Toggle AFK mode.
    usage: /afk [message]
    permission: novaess.cmd.afk
  rename:
    description: Rename the item in your hand.
    usage: /rename <name>
    permission: novaess.cmd.rename
  lore:
    description: Edit the lore of the item in your hand.
    usage: /lore <add|remove|clear|insert|set> [args]
    permission: novaess.cmd.lore
  effect:
    description: Apply a potion effect to a player.
    usage: /effect <player> <effect|clear> [duration] [amplifier]
    permission: novaess.cmd.effect
  freeze:
    description: Freeze a player.
    usage: /freeze <player>
    permission: novaess.cmd.freeze
  unfreeze:
    description: Unfreeze a player.
    usage: /unfreeze <player>
    permission: novaess.cmd.unfreeze
  tiny:
    description: Shrink a player.
    usage: /tiny <player> [size|reset]
    permission: novaess.cmd.tiny
  giant:
    description: Enlarge a player.
    usage: /giant <player> [size|reset]
    permission: novaess.cmd.giant
  captcha:
    description: Give a player a captcha to solve.
    usage: /captcha [player]
    permission: novaess.cmd.captcha
  recaptcha:
    description: Request a new captcha code without resetting failed attempts.
    usage: /recaptcha
    permission: novaess.cmd.recaptcha
  novaess:
    description: NovaEssentials management — version, reload, updates, and help.
    usage: /novaess [version|reload|update|check-for-updates|help] [page]
    aliases: [ nova ]
    permission: novaess.cmd.novaess
  repair:
    description: Repair items to full durability.
    usage: /repair [all|player] [player]
    aliases: [ fix ]
    permission: novaess.cmd.repair
  settings:
    description: Open your personal settings GUI.
    usage: /settings
    aliases: [ mysettings, prefs ]
    permission: novaess.cmd.settings
  summon:
    description: Summon entities at your position or a specific location.
    usage: /summon <entity> [x y z] [amount]
    permission: novaess.cmd.summon
  strike:
    description: Strike a player with lightning.
    usage: /strike [player]
    permission: novaess.cmd.strike
  ipban:
    description: IP ban a player or address.
    usage: /ipban <player|ip> <duration|perm> [reason]
    permission: novaess.cmd.ipban
  book:
    description: Convert a signed book to a writable book.
    usage: /book
    permission: novaess.cmd.book
  find:
    description: Find the location of a player.
    usage: /find <player>
    permission: novaess.cmd.find
  givehead:
    description: Give yourself a player head.
    usage: /givehead [player]
    permission: novaess.cmd.givehead
  playtime:
    description: View your total playtime.
    usage: /playtime
    permission: novaess.cmd.playtime
  sun:
    description: Set the weather to clear.
    usage: /sun
    aliases: [ sunny ]
    permission: novaess.cmd.weather
  rain:
    description: Set the weather to rain.
    usage: /rain
    aliases: [ rainy ]
    permission: novaess.cmd.weather
  thunder:
    description: Set the weather to thunderstorm.
    usage: /thunder
    permission: novaess.cmd.weather
  nuke:
    description: Spawn a large amount of TNT in the sky.
    usage: /nuke
    permission: novaess.cmd.nuke
  fnuke:
    description: Like /nuke but TNT does not destroy blocks.
    usage: /fnuke
    permission: novaess.cmd.fnuke
  burn:
    description: Set a player on fire with a fire trail.
    usage: /burn [player] [duration]
    permission: novaess.cmd.burn

permissions:
  novaess.*:
    description: All NovaEssentials permissions
    default: op
    children:
      novaess.cmd.*: true
      novaess.chat.*: true
      novaess.vanish.see: true
      novaess.homes.unlimited: true
      novaess.update-notify: true

  novaess.cmd.*:
    description: All command permissions
    default: op
    children:
      novaess.cmd.gm: true
      novaess.cmd.gm.other: true
      novaess.cmd.msg: true
      novaess.cmd.msg.spy: true
      novaess.cmd.vanish: true
