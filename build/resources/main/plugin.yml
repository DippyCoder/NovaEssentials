      novaess.cmd.home: true
      novaess.cmd.sethome: true
      novaess.cmd.delhome: true
      novaess.cmd.spawn: true
      novaess.cmd.setspawn: true
      novaess.cmd.warp: true
      novaess.cmd.setwarp: true
      novaess.cmd.delwarp: true
      novaess.cmd.time: true
      novaess.cmd.kit: true
      novaess.cmd.broadcast: true
      novaess.cmd.broadcast.minimessage: true
      novaess.cmd.chat: true
      novaess.cmd.mute: true
      novaess.cmd.unmute: true
      novaess.cmd.kick: true
      novaess.cmd.ban: true
      novaess.cmd.unban: true
      novaess.cmd.afk: true
      novaess.cmd.rename: true
      novaess.cmd.lore: true
      novaess.cmd.effect: true
      novaess.cmd.freeze: true
      novaess.cmd.unfreeze: true
      novaess.cmd.tiny: true
      novaess.cmd.giant: true
      novaess.cmd.captcha: true
      novaess.cmd.captcha.other: true
      novaess.cmd.recaptcha: true
      novaess.cmd.repair: true
      novaess.cmd.repair.other: true
      novaess.cmd.novaess: true
      novaess.cmd.settings: true
      novaess.cmd.summon: true
      novaess.cmd.strike: true
      novaess.cmd.ipban: true
      novaess.cmd.book: true
      novaess.cmd.find: true
      novaess.cmd.givehead: true
      novaess.cmd.playtime: true
      novaess.cmd.weather: true
      novaess.cmd.nuke: true
      novaess.cmd.fnuke: true
      novaess.cmd.burn: true

