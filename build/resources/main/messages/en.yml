  given:            "<prefix_general> <gray>Solve the captcha shown on your map. Type the code in chat."
  issued:           "<prefix_staff> <gray>Issued a captcha to <green><bold><player></bold></green><gray>."
  solved:           "<prefix_general> <gray>Captcha solved! You are now unfrozen."
  wrong:            "<prefix_error> <gray>Wrong code. <green><bold><tries></bold></green> <gray>attempt(s) remaining."
