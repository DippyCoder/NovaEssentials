# ── Lore ─────────────────────────────────────────────────
lore:
  added:         "<prefix_staff> <gray>Lore line added."
  removed:       "<prefix_staff> <gray>Removed lore line <green><bold><index></bold></green><gray>."
  cleared:       "<prefix_staff> <gray>Lore cleared."
  set:           "<prefix_staff> <gray>Set lore line <green><bold><index></bold></green><gray>."
  inserted:      "<prefix_staff> <gray>Inserted at lore line <green><bold><index></bold></green><gray>."
  invalid-index: "<prefix_error> <gray>Invalid line index <green><bold><index></bold></green><gray>."
  no-item:       "<prefix_error> <gray>You must be holding an item."
