  applied-self: "<prefix_general> <gray>Applied <green><bold><effect> <level></bold></green> <gray>for <green><bold><duration>s</bold></green><gray>."
  cleared:      "<prefix_staff> <gray>Cleared all effects from <green><bold><player></bold></green><gray>."
  cleared-self: "<prefix_general> <gray>All your effects have been cleared."
