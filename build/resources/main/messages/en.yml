# ============================================================
#   NovaEssentials — English Messages  (en.yml)
#
#   All values support full MiniMessage formatting.
#   Tag replacements use <tagname> syntax defined per command.
#
#   Prefix tags available in every message:
#     <prefix_general>  <prefix_msg>    <prefix_staff>
#     <prefix_home>     <prefix_warp>   <prefix_tp>
#     <prefix_broadcast><prefix_chat>   <prefix_kit>
#     <prefix_error>
# ============================================================

# ── Prefixes ──────────────────────────────────────────────
prefix:
  general:   "<dark_gray>[<gold>⚡</gold><dark_gray>]"
  msg:       "<dark_gray>[<aqua>✉</aqua><dark_gray>]"
  staff:     "<dark_gray>[<red>🔨</red><dark_gray>]"
  home:      "<dark_gray>[<green>🏠</green><dark_gray>]"
  warp:      "<dark_gray>[<light_purple>🌀</light_purple><dark_gray>]"
  tp:        "<dark_gray>[<yellow>📍</yellow><dark_gray>]"
  broadcast: "<dark_gray>[<aqua>📢</aqua><dark_gray>]"
  chat:      "<dark_gray>[<blue>💬</blue><dark_gray>]"
  kit:       "<dark_gray>[<gold>🎁</gold><dark_gray>]"
  error:     "<dark_gray>[<red>❌</red><dark_gray>]"

# ── General ───────────────────────────────────────────────
general:
  no-permission:    "<prefix_error> <gray>You don't have permission to do this."
  player-only:      "<prefix_error> <gray>Only players can use this command."
  console-only:     "<prefix_error> <gray>This command can only be used from the console."
  player-not-found: "<prefix_error> <gray>Player <green><bold><player></bold></green> <gray>was not found."
  invalid-args:     "<prefix_error> <gray>Usage: <green><bold><usage></bold></green>"
  command-disabled: "<prefix_error> <gray>This command is currently disabled."
  invalid-number:   "<prefix_error> <gray><green><bold><value></bold></green> <gray>is not a valid number."
  reload-success:   "<prefix_general> <gray>Configuration reloaded."

# ── Gamemode ──────────────────────────────────────────────
gamemode:
  changed-self:  "<prefix_staff> <gray>Your gamemode is now <green><bold><mode></bold></green><gray>."
  changed-other: "<prefix_staff> <gray>Set <green><bold><player></bold></green><gray>'s gamemode to <green><bold><mode></bold></green><gray>."
  notify:        "<prefix_staff> <gray>Your gamemode was changed to <green><bold><mode></bold></green> <gray>by <green><bold><sender></bold></green><gray>."
  invalid-mode:  "<prefix_error> <gray>Invalid gamemode <green><bold><mode></bold></green><gray>. Valid: <green><bold>survival, creative, adventure, spectator</bold></green>"

# ── Private Messages ──────────────────────────────────────
msg:
  sent:           "<prefix_msg> <gray>You <dark_gray>→ <green><bold><player></bold></green><gray>: <white><italic><message></italic></white>"
  received:       "<prefix_msg> <green><bold><player></bold></green> <dark_gray>→ <gray>You<gray>: <white><italic><message></italic></white>"
  spy:            "<prefix_msg> <dark_gray>[<gray>SPY<dark_gray>] <green><bold><sender></bold></green> <dark_gray>→ <green><bold><receiver></bold></green><gray>: <italic><message></italic>"
  player-blocked: "<prefix_error> <gray>You cannot message <green><bold><player></bold></green><gray>."
  blocked-by:     "<prefix_error> <gray><green><bold><player></bold></green> <gray>is not accepting messages."
  no-reply:       "<prefix_error> <gray>You have no one to reply to."
  player-offline: "<prefix_error> <gray>That player is no longer online."

# ── Vanish ────────────────────────────────────────────────
vanish:
  enabled:        "<prefix_staff> <gray>You are now <green><bold>vanished</bold></green><gray>."
  disabled:       "<prefix_staff> <gray>You are no longer vanished."
  other-enabled:  "<prefix_staff> <gray>Vanished <green><bold><player></bold></green><gray>."
  other-disabled: "<prefix_staff> <gray>Un-vanished <green><bold><player></bold></green><gray>."
  notify-on:      "<prefix_staff> <gray>You were vanished by <green><bold><sender></bold></green><gray>."
  notify-off:     "<prefix_staff> <gray>You were un-vanished by <green><bold><sender></bold></green><gray>."

# ── Fly ──────────────────────────────────────────────────
fly:
  enabled:        "<prefix_general> <gray>Flight <green><bold>enabled</bold></green><gray>."
  disabled:       "<prefix_general> <gray>Flight <green><bold>disabled</bold></green><gray>."
  other-enabled:  "<prefix_staff> <gray>Enabled flight for <green><bold><player></bold></green><gray>."
  other-disabled: "<prefix_staff> <gray>Disabled flight for <green><bold><player></bold></green><gray>."
  notify-on:      "<prefix_general> <gray>Flight was <green><bold>enabled</bold></green> <gray>by <green><bold><sender></bold></green><gray>."
  notify-off:     "<prefix_general> <gray>Flight was <green><bold>disabled</bold></green> <gray>by <green><bold><sender></bold></green><gray>."

# ── Speed ─────────────────────────────────────────────────
speed:
  set-self:   "<prefix_general> <gray>Speed set to <green><bold><speed></bold></green><gray>."
  set-other:  "<prefix_staff> <gray>Set <green><bold><player></bold></green><gray>'s speed to <green><bold><speed></bold></green><gray>."
  notify:     "<prefix_general> <gray>Your speed was set to <green><bold><speed></bold></green> <gray>by <green><bold><sender></bold></green><gray>."
  invalid:    "<prefix_error> <gray>Speed must be between <green><bold>0</bold></green> <gray>and <green><bold>10</bold></green><gray>."

# ── Enchant ───────────────────────────────────────────────
enchant:
  success:       "<prefix_staff> <gray>Applied <green><bold><enchantment> <level></bold></green> <gray>to your item."
  success-other: "<prefix_staff> <gray>Applied <green><bold><enchantment> <level></bold></green> <gray>to <green><bold><player></bold></green><gray>'s item."
  invalid:       "<prefix_error> <gray>Unknown enchantment: <green><bold><enchantment></bold></green>"
  no-item:       "<prefix_error> <gray>You must be holding an item."
  invalid-level: "<prefix_error> <gray>Level must be at least <green><bold>1</bold></green><gray>."

# ── Heal ─────────────────────────────────────────────────
heal:
  self:   "<prefix_general> <gray>You have been <green><bold>healed</bold></green><gray>."
  other:  "<prefix_staff> <gray>Healed <green><bold><player></bold></green><gray>."
  notify: "<prefix_general> <gray>You were healed by <green><bold><sender></bold></green><gray>."

# ── Feed ─────────────────────────────────────────────────
feed:
  self:   "<prefix_general> <gray>You have been <green><bold>fed</bold></green><gray>."
  other:  "<prefix_staff> <gray>Fed <green><bold><player></bold></green><gray>."
  notify: "<prefix_general> <gray>You were fed by <green><bold><sender></bold></green><gray>."

# ── God ──────────────────────────────────────────────────
god:
  enabled:        "<prefix_staff> <gray>God mode <green><bold>enabled</bold></green><gray>."
  disabled:       "<prefix_staff> <gray>God mode <green><bold>disabled</bold></green><gray>."
  other-enabled:  "<prefix_staff> <gray>Enabled god mode for <green><bold><player></bold></green><gray>."
  other-disabled: "<prefix_staff> <gray>Disabled god mode for <green><bold><player></bold></green><gray>."
  notify-on:      "<prefix_general> <gray>God mode <green><bold>enabled</bold></green> <gray>by <green><bold><sender></bold></green><gray>."
  notify-off:     "<prefix_general> <gray>God mode <green><bold>disabled</bold></green> <gray>by <green><bold><sender></bold></green><gray>."

# ── InvSee ───────────────────────────────────────────────
invsee:
  opened: "<prefix_staff> <gray>Viewing <green><bold><player></bold></green><gray>'s inventory."

# ── EnderChest ───────────────────────────────────────────
ec:
  opened-self:  "<prefix_general> <gray>Opened your ender chest."
  opened-other: "<prefix_staff> <gray>Viewing <green><bold><player></bold></green><gray>'s ender chest."

# ── Workbench ─────────────────────────────────────────────
workbench:
  opened-self:  "<prefix_general> <gray>Opened a crafting table."
  opened-other: "<prefix_staff> <gray>Opened a crafting table for <green><bold><player></bold></green><gray>."

# ── Anvil ─────────────────────────────────────────────────
anvil:
  opened-self:  "<prefix_general> <gray>Opened an anvil."
  opened-other: "<prefix_staff> <gray>Opened an anvil for <green><bold><player></bold></green><gray>."

# ── TPA ──────────────────────────────────────────────────
tpa:
  sent:              "<prefix_tp> <gray>Teleport request sent to <green><bold><player></bold></green><gray>."
  received:          "<prefix_tp> <green><bold><player></bold></green> <gray>wants to teleport to you.\n<prefix_tp> <gray>Use <green><bold>/tpaccept</bold></green> <gray>or <green><bold>/tpdeny</bold></green><gray>."
  here-sent:         "<prefix_tp> <gray>Requested <green><bold><player></bold></green> <gray>to teleport to you."
  here-received:     "<prefix_tp> <green><bold><player></bold></green> <gray>wants you to teleport to them.\n<prefix_tp> <gray>Use <green><bold>/tpaccept</bold></green> <gray>or <green><bold>/tpdeny</bold></green><gray>."
  accepted-sender:   "<prefix_tp> <green><bold><player></bold></green> <gray>accepted your request. Teleporting in <green><bold><delay>s</bold></green><gray>."
  accepted-receiver: "<prefix_tp> <gray>Accepted <green><bold><player></bold></green><gray>'s teleport request."
  accepted-instant:  "<prefix_tp> <green><bold><player></bold></green> <gray>accepted your request."
  denied-sender:     "<prefix_tp> <green><bold><player></bold></green> <gray>denied your request."
  denied-receiver:   "<prefix_tp> <gray>Denied <green><bold><player></bold></green><gray>'s teleport request."
  expired-sender:    "<prefix_tp> <gray>Your request to <green><bold><player></bold></green> <gray>has expired."
  expired-receiver:  "<prefix_tp> <gray>Request from <green><bold><player></bold></green> <gray>has expired."
  no-request:        "<prefix_error> <gray>You have no pending teleport requests."
  already-pending:   "<prefix_error> <gray>You already have a pending request with <green><bold><player></bold></green><gray>."
  blocked:           "<prefix_error> <gray>You cannot send a request to <green><bold><player></bold></green><gray>."
  cancelled-move:    "<prefix_tp> <gray>Teleportation cancelled because you moved."
  teleporting:       "<prefix_tp> <gray>Teleporting in <green><bold><delay>s</bold></green><gray>. Don't move."

# ── TpAll ─────────────────────────────────────────────────
tpall:
  teleported:       "<prefix_staff> <gray>Teleported <green><bold><count></bold></green> <gray>player(s) to you."
  notify:           "<prefix_tp> <gray>You have been teleported to <green><bold><sender></bold></green><gray>."

# ── Block ─────────────────────────────────────────────────
block:
  blocked:         "<prefix_general> <gray>Blocked <green><bold><player></bold></green><gray>."
  unblocked:       "<prefix_general> <gray>Unblocked <green><bold><player></bold></green><gray>."
  already-blocked: "<prefix_error> <gray><green><bold><player></bold></green> <gray>is already blocked."
  not-blocked:     "<prefix_error> <gray><green><bold><player></bold></green> <gray>is not blocked."
  cannot-self:     "<prefix_error> <gray>You cannot block yourself."

# ── Home ─────────────────────────────────────────────────
home:
  teleported:    "<prefix_home> <gray>Teleported to home <green><bold><home></bold></green><gray>."
  set:           "<prefix_home> <gray>Home <green><bold><home></bold></green> <gray>set."
  deleted:       "<prefix_home> <gray>Home <green><bold><home></bold></green> <gray>deleted."
  not-found:     "<prefix_error> <gray>Home <green><bold><home></bold></green> <gray>does not exist."
  limit-reached: "<prefix_error> <gray>You have reached your home limit (<green><bold><limit></bold></green><gray>)."
  list:          "<prefix_home> <gray>Your homes: <green><bold><homes></bold></green>"
  no-homes:      "<prefix_home> <gray>You have no homes set."

# ── Spawn ─────────────────────────────────────────────────
spawn:
  teleported: "<prefix_tp> <gray>Teleported to <green><bold>spawn</bold></green><gray>."
  set:        "<prefix_staff> <gray>Spawn location has been set."
  not-set:    "<prefix_error> <gray>The spawn location has not been set yet."

# ── Warp ─────────────────────────────────────────────────
warp:
  teleported: "<prefix_warp> <gray>Warped to <green><bold><warp></bold></green><gray>."
  set:        "<prefix_warp> <gray>Warp <green><bold><warp></bold></green> <gray>created."
  deleted:    "<prefix_warp> <gray>Warp <green><bold><warp></bold></green> <gray>deleted."
  not-found:  "<prefix_error> <gray>Warp <green><bold><warp></bold></green> <gray>does not exist."
  list:       "<prefix_warp> <gray>Warps: <green><bold><warps></bold></green>"
  no-warps:   "<prefix_warp> <gray>No warps have been set."

# ── Time ─────────────────────────────────────────────────
time:
  set:         "<prefix_staff> <gray>Time set to <green><bold><time></bold></green><gray>."
  invalid:     "<prefix_error> <gray>Invalid time: <green><bold><value></bold></green><gray>. Use a number, or: day, night, noon, midnight."

# ── Kit ──────────────────────────────────────────────────
kit:
  given:      "<prefix_kit> <gray>You received kit <green><bold><kit></bold></green><gray>."
  cooldown:   "<prefix_error> <gray>Kit <green><bold><kit></bold></green> <gray>is on cooldown. Available in <green><bold><time></bold></green><gray>."
  one-time:   "<prefix_error> <gray>You have already claimed kit <green><bold><kit></bold></green><gray>."
  not-found:  "<prefix_error> <gray>Kit <green><bold><kit></bold></green> <gray>does not exist."
  no-perm:    "<prefix_error> <gray>You don't have permission to use kit <green><bold><kit></bold></green><gray>."
  list:       "<prefix_kit> <gray>Available kits: <green><bold><kits></bold></green>"
  no-kits:    "<prefix_kit> <gray>No kits are available to you."
  no-money:   "<prefix_error> <gray>You need <green><bold><price></bold></green> <gray>to use kit <green><bold><kit></bold></green><gray>."
  charged:    "<prefix_kit> <gray>Charged <green><bold><price></bold></green> <gray>for kit <green><bold><kit></bold></green><gray>."
  no-economy: "<prefix_error> <gray>Economy is not available on this server."

# ── Broadcast ─────────────────────────────────────────────
broadcast:
  format: "<prefix_broadcast> <white><message></white>"

# ── Chat ─────────────────────────────────────────────────
chat:
  paused:                  "<prefix_chat> <gray>Chat has been <green><bold>paused</bold></green><gray>."
  paused-timed:            "<prefix_chat> <gray>Chat has been paused for <green><bold><duration></bold></green><gray>."
  resumed:                 "<prefix_chat> <gray>Chat has been <green><bold>resumed</bold></green><gray>."
  blocked-pause:           "<prefix_error> <gray>Chat is currently paused."
  filter-blocked:          "<prefix_error> <gray>Your message contains blocked content."
  muted:                   "<prefix_error> <gray>You are muted for <green><bold><time></bold></green><gray>."
  muted-permanent:         "<prefix_error> <gray>You are permanently muted."
  muted-player:            "<prefix_staff> <gray>Muted <green><bold><player></bold></green> <gray>for <green><bold><duration></bold></green><gray>."
  muted-permanent-player:  "<prefix_staff> <gray>Permanently muted <green><bold><player></bold></green><gray>."
  unmuted-player:          "<prefix_staff> <gray>Unmuted <green><bold><player></bold></green><gray>."
  already-muted:           "<prefix_error> <gray><green><bold><player></bold></green> <gray>is already muted."
  not-muted:               "<prefix_error> <gray><green><bold><player></bold></green> <gray>is not muted."
  notify-muted:            "<prefix_staff> <gray>You have been muted for <green><bold><duration></bold></green> <gray>by <green><bold><sender></bold></green><gray>."
  notify-muted-permanent:  "<prefix_staff> <gray>You have been permanently muted by <green><bold><sender></bold></green><gray>."
  notify-unmuted:          "<prefix_staff> <gray>You have been unmuted by <green><bold><sender></bold></green><gray>."
  staff-filter-notify:     "<prefix_staff> <gray><green><bold><player></bold></green><gray>'s message was filtered: <italic><message></italic>"

# ── Sudo ─────────────────────────────────────────────────
sudo:
  executed: "<prefix_staff> <gray>Executed as <green><bold><player></bold></green><gray>: <italic><action></italic>"

# ── Kick ─────────────────────────────────────────────────
kick:
  kicked:           "<prefix_staff> <gray>Kicked <green><bold><player></bold></green><gray>."
  staff-broadcast:  "<prefix_staff> <green><bold><player></bold></green> <gray>was kicked by <green><bold><sender></bold></green> <gray>— <italic><reason></italic>"
  kick-screen:      "<red><bold>You have been kicked</bold></red>\n<gray>Reason: <white><reason></white>\n<gray>Kicked by: <green><bold><sender></bold></green>"

# ── Ban ───────────────────────────────────────────────────
ban:
  banned:           "<prefix_staff> <gray>Banned <green><bold><player></bold></green> <gray>for <green><bold><duration></bold></green><gray>."
  banned-permanent: "<prefix_staff> <gray>Permanently banned <green><bold><player></bold></green><gray>."
  unbanned:         "<prefix_staff> <gray>Unbanned <green><bold><player></bold></green><gray>."
  already-banned:   "<prefix_error> <gray><green><bold><player></bold></green> <gray>is already banned."
  not-banned:       "<prefix_error> <gray><green><bold><player></bold></green> <gray>is not banned."
  staff-broadcast:  "<prefix_staff> <green><bold><player></bold></green> <gray>was banned by <green><bold><sender></bold></green> <gray>for <green><bold><duration></bold></green> <gray>— <italic><reason></italic>"
  staff-unban:      "<prefix_staff> <green><bold><player></bold></green> <gray>was unbanned by <green><bold><sender></bold></green><gray>."
  ban-screen:       "<red><bold>You have been banned</bold></red>\n<gray>Reason: <white><reason></white>\n<gray>Duration: <green><bold><duration></bold></green>\n<gray>Banned by: <green><bold><sender></bold></green>"

# ── Back ─────────────────────────────────────────────────
back:
  teleported:  "<prefix_tp> <gray>Teleported to your last death location."
  no-location: "<prefix_error> <gray>No previous location to return to."

# ── AFK ──────────────────────────────────────────────────
afk:
  enabled:         "<prefix_general> <gray>You are now <green><bold>AFK</bold></green><gray>."
  disabled:        "<prefix_general> <gray>You are no longer AFK."
  broadcast-on:    "<prefix_general> <green><bold><player></bold></green> <gray>is now AFK."
  broadcast-off:   "<prefix_general> <green><bold><player></bold></green> <gray>is no longer AFK."
  broadcast-on-msg: "<prefix_general> <green><bold><player></bold></green> <gray>is now AFK: <italic><message></italic>"
  message-reply:   "<prefix_general> <green><bold><player></bold></green> <gray>is AFK: <italic><message></italic>"
  message-no-msg:  "<prefix_general> <green><bold><player></bold></green> <gray>is currently AFK."

