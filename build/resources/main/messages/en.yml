  dodge-ban-screen: "<red><bold>You have been banned</bold></red>\n<gray>Reason: <white>Disconnected to avoid captcha</white>\n<gray>Banned by: <green><bold>NovaEssentials</bold></green>"
  no-captcha:       "<prefix_error> <gray>You don't have an active captcha."
  already:          "<prefix_error> <gray><green><bold><player></bold></green> <gray>already has an active captcha."
  recaptcha-given:  "<prefix_general> <gray>New captcha code issued. You have <green><bold><tries></bold></green> <gray>attempt(s) remaining."
  recaptcha-none:   "<prefix_error> <gray>You don't have an active captcha to refresh."

# ── Repair ────────────────────────────────────────────────
