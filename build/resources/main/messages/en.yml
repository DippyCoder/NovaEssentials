  repaired-other: "<prefix_staff> <gray>Repaired <green><bold><player></bold></green><gray>'s held item."
  all:            "<prefix_general> <gray>All items in your inventory have been <green><bold>repaired</bold></green><gray>."
  all-other:      "<prefix_staff> <gray>Repaired all items in <green><bold><player></bold></green><gray>'s inventory."
  no-item:        "<prefix_error> <gray>You must be holding a damageable item."
  notify:         "<prefix_general> <gray>Your held item was repaired by <green><bold><sender></bold></green><gray>."
  notify-all:     "<prefix_general> <gray>Your inventory was repaired by <green><bold><sender></bold></green><gray>."

# ── NovaEssentials Admin ─────────────────────────────────
novaess:
  check-enabled:  "<prefix_general> <gray>Automatic update checking <green><bold>enabled</bold></green><gray>."
  check-disabled: "<prefix_general> <gray>Automatic update checking <green><bold>disabled</bold></green><gray>."

# ── Size ─────────────────────────────────────────────────
size:
