  frozen:          "<prefix_staff> <gray>Froze <green><bold><player></bold></green><gray>."
  unfrozen:        "<prefix_staff> <gray>Unfroze <green><bold><player></bold></green><gray>."
  already-frozen:  "<prefix_error> <gray><green><bold><player></bold></green> <gray>is already frozen."
  not-frozen:      "<prefix_error> <gray><green><bold><player></bold></green> <gray>is not frozen."
  notify-frozen:   "<prefix_staff> <gray>You have been <green><bold>frozen</bold></green> <gray>by <green><bold><sender></bold></green><gray>."
  notify-unfrozen: "<prefix_staff> <gray>You have been <green><bold>unfrozen</bold></green> <gray>by <green><bold><sender></bold></green><gray>."
