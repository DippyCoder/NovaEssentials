  expired-receiver:  "<prefix_tp> <gray>Anfrage von <green><bold><player></bold></green> <gray>ist abgelaufen."
  no-request:        "<prefix_error> <gray>Du hast keine ausstehenden Teleportationsanfragen."
  already-pending:   "<prefix_error> <gray>Du hast bereits eine ausstehende Anfrage bei <green><bold><player></bold></green><gray>."
  blocked:           "<prefix_error> <gray>Du kannst keine Anfrage an <green><bold><player></bold></green><gray> senden."
  cancelled-move:    "<prefix_tp> <gray>Teleportation abgebrochen, da du dich bewegt hast."
  teleporting:       "<prefix_tp> <gray>Teleportation in <green><bold><delay>s</bold></green><gray>. Bitte nicht bewegen."
