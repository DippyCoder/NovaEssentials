  changed-other: "<prefix_staff> <gray>Spielmodus von <green><bold><player></bold></green><gray> auf <green><bold><mode></bold></green><gray> gesetzt."
  notify:        "<prefix_staff> <gray>Dein Spielmodus wurde von <green><bold><sender></bold></green><gray> auf <green><bold><mode></bold></green> <gray>geändert."
  invalid-mode:  "<prefix_error> <gray>Ungültiger Spielmodus <green><bold><mode></bold></green><gray>. Gültig: <green><bold>survival, creative, adventure, spectator</bold></green>"

msg:
  sent:           "<prefix_msg> <gray>Du <dark_gray>→ <green><bold><player></bold></green><gray>: <white><italic><message></italic></white>"
  received:       "<prefix_msg> <green><bold><player></bold></green> <dark_gray>→ <gray>Du<gray>: <white><italic><message></italic></white>"
  spy:            "<prefix_msg> <dark_gray>[<gray>SPY<dark_gray>] <green><bold><sender></bold></green> <dark_gray>→ <green><bold><receiver></bold></green><gray>: <italic><message></italic>"
  player-blocked: "<prefix_error> <gray>Du kannst <green><bold><player></bold></green><gray> keine Nachricht senden."
  blocked-by:     "<prefix_error> <gray><green><bold><player></bold></green> <gray>akzeptiert keine Nachrichten."
  not-accepting:   "<prefix_error> <gray><green><bold><player></bold></green> <gray>akzeptiert keine Nachrichten."
  no-reply:       "<prefix_error> <gray>Du hast niemanden, dem du antworten könntest."
  player-offline: "<prefix_error> <gray>Dieser Spieler ist nicht mehr online."

