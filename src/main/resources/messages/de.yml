  accepted-sender:   "<prefix_tp> <green><bold><player></bold></green> <gray>hat deine Anfrage angenommen. Teleportation in <green><bold><delay>s</bold></green><gray>."
  accepted-receiver: "<prefix_tp> <gray>Teleportationsanfrage von <green><bold><player></bold></green><gray> angenommen."
