# ============================================================
#   NovaEssentials — German Messages  (de.yml)
#
#   All values support full MiniMessage formatting.
#   Tag replacements use <tagname> syntax defined per command.
#   Language translated with Claude
#
#   Prefix tags available in every message:
#     <prefix_general>  <prefix_msg>    <prefix_staff>
#     <prefix_home>     <prefix_warp>   <prefix_tp>
#     <prefix_broadcast><prefix_chat>   <prefix_kit>
#     <prefix_error>
# ============================================================

prefix:
  general:   "<dark_gray>[<gold>⚡</gold><dark_gray>]"
  msg:       "<dark_gray>[<aqua>✉</aqua><dark_gray>]"
  staff:     "<dark_gray>[<red>🔨</red><dark_gray>]"
  home:      "<dark_gray>[<green>🏠</green><dark_gray>]"
  warp:      "<dark_gray>[<light_purple>🌀</light_purple><dark_gray>]"
  tp:        "<dark_gray>[<yellow>📍</yellow><dark_gray>]"
  broadcast: "<dark_gray>[<aqua>📢</aqua><dark_gray>]"
  chat:      "<dark_gray>[<blue>💬</blue><dark_gray>]"
  kit:       "<dark_gray>[<gold>🎁</gold><dark_gray>]"
  error:     "<dark_gray>[<red>❌</red><dark_gray>]"

general:
  no-permission:    "<prefix_error> <gray>Du hast keine Berechtigung dafür."
  player-only:      "<prefix_error> <gray>Dieser Befehl kann nur von Spielern verwendet werden."
  console-only:     "<prefix_error> <gray>Dieser Befehl kann nur von der Konsole verwendet werden."
  player-not-found: "<prefix_error> <gray>Spieler <green><bold><player></bold></green> <gray>wurde nicht gefunden."
  invalid-args:     "<prefix_error> <gray>Verwendung: <green><bold><usage></bold></green>"
  command-disabled: "<prefix_error> <gray>Dieser Befehl ist derzeit deaktiviert."
  invalid-number:   "<prefix_error> <gray><green><bold><value></bold></green> <gray>ist keine gültige Zahl."
  reload-success:   "<prefix_general> <gray>Konfiguration neu geladen."

gamemode:
