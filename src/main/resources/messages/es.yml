  invalid-args:     "<prefix_error> <gray>Uso: <green><bold><usage></bold></green>"
  command-disabled: "<prefix_error> <gray>Este comando está actualmente desactivado."
  invalid-number:   "<prefix_error> <gray><green><bold><value></bold></green> <gray>no es un número válido."
  reload-success:   "<prefix_general> <gray>Configuración recargada."

