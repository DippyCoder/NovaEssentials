  invalid-args:     "<prefix_error> <gray>Uso: <green><bold><usage></bold></green>"
  command-disabled: "<prefix_error> <gray>Este comando está desativado no momento."
  invalid-number:   "<prefix_error> <gray><green><bold><value></bold></green> <gray>não é um número válido."
  reload-success:   "<prefix_general> <gray>Configuração recarregada."

