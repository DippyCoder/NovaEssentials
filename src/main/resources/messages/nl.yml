  unfrozen:        "<prefix_staff> <gray><green><bold><player></bold></green><gray> ontdooid."
  already-frozen:  "<prefix_error> <gray><green><bold><player></bold></green> <gray>is al bevroren."
  not-frozen:      "<prefix_error> <gray><green><bold><player></bold></green> <gray>is niet bevroren."
  notify-frozen:   "<prefix_staff> <gray>Je bent <green><bold>bevroren</bold></green> <gray>door <green><bold><sender></bold></green><gray>."
  notify-unfrozen: "<prefix_staff> <gray>Je bent <green><bold>ontdooid</bold></green> <gray>door <green><bold><sender></bold></green><gray>."
  blocked:         "<prefix_error> <gray>Je bent bevroren en kunt dat niet doen."
  still-frozen:    "<prefix_staff> <gray>Je bent nog steeds <green><bold>bevroren</bold></green><gray>."

# ── Captcha ───────────────────────────────────────────────
captcha:
  given:            "<prefix_general> <gray>Los de captcha op die op jouw kaart wordt weergegeven. Typ de code in de chat."
  issued:           "<prefix_staff> <gray>Een captcha uitgegeven aan <green><bold><player></bold></green><gray>."
  solved:           "<prefix_general> <gray>Captcha opgelost! Je bent nu ontdooid."
  wrong:            "<prefix_error> <gray>Verkeerde code. <green><bold><tries></bold></green> <gray>poging(en) resterend."
