  set:           "<prefix_staff> <gray>Lore-regel <green><bold><index></bold></green><gray> ingesteld."
  inserted:      "<prefix_staff> <gray>Ingevoegd op lore-regel <green><bold><index></bold></green><gray>."
  invalid-index: "<prefix_error> <gray>Ongeldig regelindex <green><bold><index></bold></green><gray>."
  no-item:       "<prefix_error> <gray>Je moet een item vasthouden."
  no-lore:       "<prefix_error> <gray>Dit item heeft geen lore."

# ── Effect ────────────────────────────────────────────────
