  applied:      "<prefix_staff> <gray><green><bold><effect> <level></bold></green> <gray>voor <green><bold><duration>s</bold></green> <gray>toegepast op <green><bold><player></bold></green><gray>."
  applied-self: "<prefix_general> <gray><green><bold><effect> <level></bold></green> <gray>voor <green><bold><duration>s</bold></green><gray> toegepast."
  cleared:      "<prefix_staff> <gray>Alle effecten van <green><bold><player></bold></green><gray> verwijderd."
  cleared-self: "<prefix_general> <gray>Al jouw effecten zijn verwijderd."
  invalid:      "<prefix_error> <gray>Onbekend effect: <green><bold><effect></bold></green>"

