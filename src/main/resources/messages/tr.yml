  no-money:   "<prefix_error> <gray><green><bold><kit></bold></green><gray> kitini kullanmak için <green><bold><price></bold></green><gray> paraya ihtiyacın var."
  charged:    "<prefix_kit> <gray><green><bold><kit></bold></green><gray> kiti için <green><bold><price></bold></green><gray> ücret alındı."
