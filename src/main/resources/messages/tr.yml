# ── Broadcast ─────────────────────────────────────────────
broadcast:
  format: "<prefix_broadcast> <white><message></white>"

# ── Chat ─────────────────────────────────────────────────
chat:
  paused:                  "<prefix_chat> <gray>Sohbet <green><bold>duraklatıldı</bold></green><gray>."
  paused-timed:            "<prefix_chat> <gray>Sohbet <green><bold><duration></bold></green><gray> süreliğine duraklatıldı."
  resumed:                 "<prefix_chat> <gray>Sohbet <green><bold>devam ettirildi</bold></green><gray>."
  blocked-pause:           "<prefix_error> <gray>Sohbet şu anda duraklatılmış."
  filter-blocked:          "<prefix_error> <gray>Mesajın engellenmiş içerik barındırıyor."
  muted:                   "<prefix_error> <gray><green><bold><time></bold></green><gray> süreliğine susturuldun."
  muted-permanent:         "<prefix_error> <gray>Kalıcı olarak susturuldun."
  muted-player:            "<prefix_staff> <gray><green><bold><player></bold></green> <gray><green><bold><duration></bold></green><gray> süreliğine susturuldu."
  muted-permanent-player:  "<prefix_staff> <gray><green><bold><player></bold></green><gray> kalıcı olarak susturuldu."
  unmuted-player:          "<prefix_staff> <gray><green><bold><player></bold></green><gray> susturması kaldırıldı."
  already-muted:           "<prefix_error> <gray><green><bold><player></bold></green> <gray>zaten susturulmuş."
  not-muted:               "<prefix_error> <gray><green><bold><player></bold></green> <gray>susturulmuş değil."
  notify-muted:            "<prefix_staff> <gray><green><bold><sender></bold></green><gray> tarafından <green><bold><duration></bold></green><gray> süreliğine susturuldun."
  notify-muted-permanent:  "<prefix_staff> <gray><green><bold><sender></bold></green><gray> tarafından kalıcı olarak susturuldun."
  notify-unmuted:          "<prefix_staff> <gray>Susturman <green><bold><sender></bold></green><gray> tarafından kaldırıldı."
  staff-filter-notify:     "<prefix_staff> <gray><green><bold><player></bold></green><gray> adlı oyuncunun mesajı filtrelendi: <italic><message></italic>"

# ── Sudo ─────────────────────────────────────────────────
sudo:
  executed: "<prefix_staff> <gray><green><bold><player></bold></green><gray> olarak yürütüldü: <italic><action></italic>"

# ── Kick ─────────────────────────────────────────────────
kick:
