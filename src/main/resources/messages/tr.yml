# ============================================================
#   NovaEssentials — Turkish Messages  (tr.yml)
#
#   All values support full MiniMessage formatting.
#   Tag replacements use <tagname> syntax defined per command.
#   Language translated with Claude
#
#   Prefix tags available in every message:
#     <prefix_general>  <prefix_msg>    <prefix_staff>
#     <prefix_home>     <prefix_warp>   <prefix_tp>
#     <prefix_broadcast><prefix_chat>   <prefix_kit>
#     <prefix_error>
# ============================================================

# ── Prefixes ──────────────────────────────────────────────
prefix:
  general:   "<dark_gray>[<gold>⚡</gold><dark_gray>]"
  msg:       "<dark_gray>[<aqua>✉</aqua><dark_gray>]"
  staff:     "<dark_gray>[<red>🔨</red><dark_gray>]"
  home:      "<dark_gray>[<green>🏠</green><dark_gray>]"
  warp:      "<dark_gray>[<light_purple>🌀</light_purple><dark_gray>]"
  tp:        "<dark_gray>[<yellow>📍</yellow><dark_gray>]"
  broadcast: "<dark_gray>[<aqua>📢</aqua><dark_gray>]"
  chat:      "<dark_gray>[<blue>💬</blue><dark_gray>]"
  kit:       "<dark_gray>[<gold>🎁</gold><dark_gray>]"
  error:     "<dark_gray>[<red>❌</red><dark_gray>]"

# ── General ───────────────────────────────────────────────
general:
  no-permission:    "<prefix_error> <gray>Bunu yapmak için yetkin yok."
  player-only:      "<prefix_error> <gray>Bu komutu yalnızca oyuncular kullanabilir."
  console-only:     "<prefix_error> <gray>Bu komut yalnızca konsoldan kullanılabilir."
  player-not-found: "<prefix_error> <gray><green><bold><player></bold></green> <gray>adlı oyuncu bulunamadı."
  invalid-args:     "<prefix_error> <gray>Kullanım: <green><bold><usage></bold></green>"
  command-disabled: "<prefix_error> <gray>Bu komut şu anda devre dışı."
  invalid-number:   "<prefix_error> <gray><green><bold><value></bold></green> <gray>geçerli bir sayı değil."
  reload-success:   "<prefix_general> <gray>Yapılandırma yeniden yüklendi."

# ── Gamemode ──────────────────────────────────────────────
gamemode:
  changed-self:  "<prefix_staff> <gray>Oyun modun artık <green><bold><mode></bold></green><gray>."
  changed-other: "<prefix_staff> <gray><green><bold><player></bold></green><gray> adlı oyuncunun modu <green><bold><mode></bold></green><gray> olarak ayarlandı."
  notify:        "<prefix_staff> <gray>Oyun modun <green><bold><mode></bold></green> <gray>olarak <green><bold><sender></bold></green><gray> tarafından değiştirildi."
  invalid-mode:  "<prefix_error> <gray>Geçersiz oyun modu <green><bold><mode></bold></green><gray>. Geçerliler: <green><bold>survival, creative, adventure, spectator</bold></green>"

# ── Private Messages ──────────────────────────────────────
msg:
  sent:           "<prefix_msg> <gray>Sen <dark_gray>→ <green><bold><player></bold></green><gray>: <white><italic><message></italic></white>"
  received:       "<prefix_msg> <green><bold><player></bold></green> <dark_gray>→ <gray>Sana<gray>: <white><italic><message></italic></white>"
  spy:            "<prefix_msg> <dark_gray>[<gray>SPY<dark_gray>] <green><bold><sender></bold></green> <dark_gray>→ <green><bold><receiver></bold></green><gray>: <italic><message></italic>"
  player-blocked: "<prefix_error> <gray><green><bold><player></bold></green><gray> adlı oyuncuya mesaj gönderemezsin."
  blocked-by:     "<prefix_error> <gray><green><bold><player></bold></green> <gray>mesaj kabul etmiyor."
  no-reply:       "<prefix_error> <gray>Yanıtlayacak kimsen yok."
  player-offline: "<prefix_error> <gray>O oyuncu artık çevrimiçi değil."

# ── Vanish ────────────────────────────────────────────────
vanish:
  enabled:        "<prefix_staff> <gray>Artık <green><bold>görünmezsin</bold></green><gray>."
  disabled:       "<prefix_staff> <gray>Artık görünürsün."
  other-enabled:  "<prefix_staff> <gray><green><bold><player></bold></green><gray> görünmez yapıldı."
  other-disabled: "<prefix_staff> <gray><green><bold><player></bold></green><gray> tekrar görünür yapıldı."
  notify-on:      "<prefix_staff> <gray><green><bold><sender></bold></green><gray> tarafından görünmez yapıldın."
  notify-off:     "<prefix_staff> <gray><green><bold><sender></bold></green><gray> tarafından tekrar görünür yapıldın."

# ── Fly ──────────────────────────────────────────────────
fly:
  enabled:        "<prefix_general> <gray>Uçuş <green><bold>etkinleştirildi</bold></green><gray>."
  disabled:       "<prefix_general> <gray>Uçuş <green><bold>devre dışı bırakıldı</bold></green><gray>."
  other-enabled:  "<prefix_staff> <gray><green><bold><player></bold></green><gray> için uçuş etkinleştirildi."
  other-disabled: "<prefix_staff> <gray><green><bold><player></bold></green><gray> için uçuş devre dışı bırakıldı."
  notify-on:      "<prefix_general> <gray>Uçuş <green><bold><sender></bold></green><gray> tarafından <green><bold>etkinleştirildi</bold></green><gray>."
  notify-off:     "<prefix_general> <gray>Uçuş <green><bold><sender></bold></green><gray> tarafından <green><bold>devre dışı bırakıldı</bold></green><gray>."

# ── Speed ─────────────────────────────────────────────────
speed:
  set-self:   "<prefix_general> <gray>Hız <green><bold><speed></bold></green><gray> olarak ayarlandı."
  set-other:  "<prefix_staff> <gray><green><bold><player></bold></green><gray> adlı oyuncunun hızı <green><bold><speed></bold></green><gray> olarak ayarlandı."
  notify:     "<prefix_general> <gray>Hızın <green><bold><sender></bold></green><gray> tarafından <green><bold><speed></bold></green><gray> olarak ayarlandı."
  invalid:    "<prefix_error> <gray>Hız <green><bold>0</bold></green> <gray>ile <green><bold>10</bold></green><gray> arasında olmalıdır."

# ── Enchant ───────────────────────────────────────────────
enchant:
  success:       "<prefix_staff> <gray>Eşyanıza <green><bold><enchantment> <level></bold></green> <gray>uygulandı."
  success-other: "<prefix_staff> <gray><green><bold><player></bold></green><gray> adlı oyuncunun eşyasına <green><bold><enchantment> <level></bold></green> <gray>uygulandı."
  invalid:       "<prefix_error> <gray>Bilinmeyen büyü: <green><bold><enchantment></bold></green>"
  no-item:       "<prefix_error> <gray>Elinde bir eşya tutmalısın."
  invalid-level: "<prefix_error> <gray>Seviye en az <green><bold>1</bold></green><gray> olmalıdır."

# ── Heal ─────────────────────────────────────────────────
heal:
  self:   "<prefix_general> <gray><green><bold>İyileştirildin</bold></green><gray>."
  other:  "<prefix_staff> <gray><green><bold><player></bold></green><gray> iyileştirildi."
  notify: "<prefix_general> <gray><green><bold><sender></bold></green><gray> tarafından iyileştirildin."

# ── Feed ─────────────────────────────────────────────────
feed:
  self:   "<prefix_general> <gray><green><bold>Doyuruldun</bold></green><gray>."
  other:  "<prefix_staff> <gray><green><bold><player></bold></green><gray> doyuruldu."
  notify: "<prefix_general> <gray><green><bold><sender></bold></green><gray> tarafından doyuruldun."

# ── God ──────────────────────────────────────────────────
god:
  enabled:        "<prefix_staff> <gray>Tanrı modu <green><bold>etkinleştirildi</bold></green><gray>."
  disabled:       "<prefix_staff> <gray>Tanrı modu <green><bold>devre dışı bırakıldı</bold></green><gray>."
  other-enabled:  "<prefix_staff> <gray><green><bold><player></bold></green><gray> için tanrı modu etkinleştirildi."
  other-disabled: "<prefix_staff> <gray><green><bold><player></bold></green><gray> için tanrı modu devre dışı bırakıldı."
  notify-on:      "<prefix_general> <gray>Tanrı modu <green><bold><sender></bold></green><gray> tarafından <green><bold>etkinleştirildi</bold></green><gray>."
  notify-off:     "<prefix_general> <gray>Tanrı modu <green><bold><sender></bold></green><gray> tarafından <green><bold>devre dışı bırakıldı</bold></green><gray>."

# ── InvSee ───────────────────────────────────────────────
invsee:
  opened: "<prefix_staff> <gray><green><bold><player></bold></green><gray> adlı oyuncunun envanteri görüntüleniyor."

# ── EnderChest ───────────────────────────────────────────
ec:
  opened-self:  "<prefix_general> <gray>Kendi ender sandığın açıldı."
  opened-other: "<prefix_staff> <gray><green><bold><player></bold></green><gray> adlı oyuncunun ender sandığı görüntüleniyor."

# ── Workbench ─────────────────────────────────────────────
workbench:
  opened-self:  "<prefix_general> <gray>Bir tezgah açıldı."
  opened-other: "<prefix_staff> <gray><green><bold><player></bold></green><gray> için bir tezgah açıldı."

# ── Anvil ─────────────────────────────────────────────────
anvil:
  opened-self:  "<prefix_general> <gray>Bir örs açıldı."
  opened-other: "<prefix_staff> <gray><green><bold><player></bold></green><gray> için bir örs açıldı."

# ── TPA ──────────────────────────────────────────────────
tpa:
  sent:              "<prefix_tp> <gray><green><bold><player></bold></green><gray> adlı oyuncuya ışınlanma isteği gönderildi."
  received:          "<prefix_tp> <green><bold><player></bold></green> <gray>sana ışınlanmak istiyor.\n<prefix_tp> <gray><green><bold>/tpaccept</bold></green> <gray>veya <green><bold>/tpdeny</bold></green><gray> kullan."
  here-sent:         "<prefix_tp> <gray><green><bold><player></bold></green><gray> adlı oyuncudan sana ışınlanması istendi."
  here-received:     "<prefix_tp> <green><bold><player></bold></green> <gray>onlara ışınlanmanı istiyor.\n<prefix_tp> <gray><green><bold>/tpaccept</bold></green> <gray>veya <green><bold>/tpdeny</bold></green><gray> kullan."
  accepted-sender:   "<prefix_tp> <green><bold><player></bold></green> <gray>isteğini kabul etti. <green><bold><delay>s</bold></green><gray> içinde ışınlanıyorsun."
  accepted-receiver: "<prefix_tp> <gray><green><bold><player></bold></green><gray> adlı oyuncunun ışınlanma isteği kabul edildi."
  accepted-instant:  "<prefix_tp> <green><bold><player></bold></green> <gray>isteğini kabul etti."
  denied-sender:     "<prefix_tp> <green><bold><player></bold></green> <gray>isteğini reddetti."
  denied-receiver:   "<prefix_tp> <gray><green><bold><player></bold></green><gray> adlı oyuncunun ışınlanma isteği reddedildi."
  expired-sender:    "<prefix_tp> <gray><green><bold><player></bold></green><gray> adlı oyuncuya gönderilen isteğin süresi doldu."
  expired-receiver:  "<prefix_tp> <gray><green><bold><player></bold></green><gray> adlı oyuncunun isteğinin süresi doldu."
  no-request:        "<prefix_error> <gray>Bekleyen ışınlanma isteğin yok."
  already-pending:   "<prefix_error> <gray><green><bold><player></bold></green><gray> ile zaten bekleyen bir isteğin var."
  blocked:           "<prefix_error> <gray><green><bold><player></bold></green><gray> adlı oyuncuya istek gönderemezsin."
  cancelled-move:    "<prefix_tp> <gray>Hareket ettiğin için ışınlanma iptal edildi."
  teleporting:       "<prefix_tp> <gray><green><bold><delay>s</bold></green><gray> içinde ışınlanıyorsun. Hareket etme."

# ── TpAll ─────────────────────────────────────────────────
tpall:
  teleported:       "<prefix_staff> <gray><green><bold><count></bold></green> <gray>oyuncu sana ışınlandı."
  notify:           "<prefix_tp> <gray><green><bold><sender></bold></green><gray> adlı oyuncuya ışınlandın."

# ── Block ─────────────────────────────────────────────────
block:
  blocked:         "<prefix_general> <gray><green><bold><player></bold></green><gray> engellendi."
  unblocked:       "<prefix_general> <gray><green><bold><player></bold></green><gray> engeli kaldırıldı."
  already-blocked: "<prefix_error> <gray><green><bold><player></bold></green> <gray>zaten engellenmiş."
  not-blocked:     "<prefix_error> <gray><green><bold><player></bold></green> <gray>engellenmiş değil."
  cannot-self:     "<prefix_error> <gray>Kendini engelleyemezsin."

# ── Home ─────────────────────────────────────────────────
home:
  teleported:    "<prefix_home> <gray><green><bold><home></bold></green><gray> adlı eve ışınlandın."
  set:           "<prefix_home> <gray><green><bold><home></bold></green> <gray>adlı ev ayarlandı."
  deleted:       "<prefix_home> <gray><green><bold><home></bold></green> <gray>adlı ev silindi."
  not-found:     "<prefix_error> <gray><green><bold><home></bold></green> <gray>adlı ev mevcut değil."
  limit-reached: "<prefix_error> <gray>Ev limitine ulaştın (<green><bold><limit></bold></green><gray>)."
  list:          "<prefix_home> <gray>Evlerin: <green><bold><homes></bold></green>"
  no-homes:      "<prefix_home> <gray>Kayıtlı evin yok."

# ── Spawn ─────────────────────────────────────────────────
spawn:
  teleported: "<prefix_tp> <gray><green><bold>Doğuş noktasına</bold></green><gray> ışınlandın."
  set:        "<prefix_staff> <gray>Doğuş noktası konumu ayarlandı."
  not-set:    "<prefix_error> <gray>Doğuş noktası henüz ayarlanmadı."

# ── Warp ─────────────────────────────────────────────────
warp:
  teleported: "<prefix_warp> <gray><green><bold><warp></bold></green><gray> adlı warp'a ışınlandın."
  set:        "<prefix_warp> <gray><green><bold><warp></bold></green> <gray>adlı warp oluşturuldu."
  deleted:    "<prefix_warp> <gray><green><bold><warp></bold></green> <gray>adlı warp silindi."
  not-found:  "<prefix_error> <gray><green><bold><warp></bold></green> <gray>adlı warp mevcut değil."
  list:       "<prefix_warp> <gray>Warp'lar: <green><bold><warps></bold></green>"
  no-warps:   "<prefix_warp> <gray>Henüz hiç warp ayarlanmadı."

# ── Time ─────────────────────────────────────────────────
time:
  set:         "<prefix_staff> <gray>Zaman <green><bold><time></bold></green><gray> olarak ayarlandı."
  invalid:     "<prefix_error> <gray>Geçersiz zaman: <green><bold><value></bold></green><gray>. Bir sayı ya da şunları kullan: day, night, noon, midnight."

# ── Kit ──────────────────────────────────────────────────
kit:
  given:      "<prefix_kit> <gray><green><bold><kit></bold></green><gray> kitini aldın."
  cooldown:   "<prefix_error> <gray><green><bold><kit></bold></green> <gray>kiti bekleme süresinde. <green><bold><time></bold></green><gray> sonra kullanılabilir."
  one-time:   "<prefix_error> <gray><green><bold><kit></bold></green><gray> kitini zaten aldın."
  not-found:  "<prefix_error> <gray><green><bold><kit></bold></green> <gray>adlı kit mevcut değil."
  no-perm:    "<prefix_error> <gray><green><bold><kit></bold></green><gray> kitini kullanmak için yetkin yok."
  list:       "<prefix_kit> <gray>Mevcut kitler: <green><bold><kits></bold></green>"
