# ============================================================
#   NovaEssentials — Czech Messages  (cs.yml)
#
#   All values support full MiniMessage formatting.
#   Tag replacements use <tagname> syntax defined per command.
#   Language translated with Claude
#
#   Prefix tags available in every message:
#     <prefix_general>  <prefix_msg>    <prefix_staff>
#     <prefix_home>     <prefix_warp>   <prefix_tp>
#     <prefix_broadcast><prefix_chat>   <prefix_kit>
#     <prefix_error>
# ============================================================

# ── Prefixes ──────────────────────────────────────────────
prefix:
  general:   "<dark_gray>[<gold>⚡</gold><dark_gray>]"
  msg:       "<dark_gray>[<aqua>✉</aqua><dark_gray>]"
  staff:     "<dark_gray>[<red>🔨</red><dark_gray>]"
  home:      "<dark_gray>[<green>🏠</green><dark_gray>]"
  warp:      "<dark_gray>[<light_purple>🌀</light_purple><dark_gray>]"
  tp:        "<dark_gray>[<yellow>📍</yellow><dark_gray>]"
  broadcast: "<dark_gray>[<aqua>📢</aqua><dark_gray>]"
  chat:      "<dark_gray>[<blue>💬</blue><dark_gray>]"
  kit:       "<dark_gray>[<gold>🎁</gold><dark_gray>]"
  error:     "<dark_gray>[<red>❌</red><dark_gray>]"

# ── General ───────────────────────────────────────────────
general:
  no-permission:    "<prefix_error> <gray>Nemáš oprávnění k provedení tohoto příkazu."
  player-only:      "<prefix_error> <gray>Tento příkaz mohou používat pouze hráči."
  console-only:     "<prefix_error> <gray>Tento příkaz lze použít pouze z konzole."
  player-not-found: "<prefix_error> <gray>Hráč <green><bold><player></bold></green> <gray>nebyl nalezen."
  invalid-args:     "<prefix_error> <gray>Použití: <green><bold><usage></bold></green>"
  command-disabled: "<prefix_error> <gray>Tento příkaz je momentálně zakázán."
  invalid-number:   "<prefix_error> <gray><green><bold><value></bold></green> <gray>není platné číslo."
  reload-success:   "<prefix_general> <gray>Konfigurace znovu načtena."

# ── Gamemode ──────────────────────────────────────────────
gamemode:
  changed-self:  "<prefix_staff> <gray>Tvůj herní režim je nyní <green><bold><mode></bold></green><gray>."
  changed-other: "<prefix_staff> <gray>Herní režim hráče <green><bold><player></bold></green><gray> byl nastaven na <green><bold><mode></bold></green><gray>."
  notify:        "<prefix_staff> <gray>Tvůj herní režim byl změněn na <green><bold><mode></bold></green> <gray>hráčem <green><bold><sender></bold></green><gray>."
  invalid-mode:  "<prefix_error> <gray>Neplatný herní režim <green><bold><mode></bold></green><gray>. Platné: <green><bold>survival, creative, adventure, spectator</bold></green>"

# ── Private Messages ──────────────────────────────────────
msg:
  sent:           "<prefix_msg> <gray>Ty <dark_gray>→ <green><bold><player></bold></green><gray>: <white><italic><message></italic></white>"
  received:       "<prefix_msg> <green><bold><player></bold></green> <dark_gray>→ <gray>Tobě<gray>: <white><italic><message></italic></white>"
  spy:            "<prefix_msg> <dark_gray>[<gray>SPY<dark_gray>] <green><bold><sender></bold></green> <dark_gray>→ <green><bold><receiver></bold></green><gray>: <italic><message></italic>"
  player-blocked: "<prefix_error> <gray>Nemůžeš napsat hráči <green><bold><player></bold></green><gray>."
  blocked-by:     "<prefix_error> <gray><green><bold><player></bold></green> <gray>nepřijímá zprávy."
  no-reply:       "<prefix_error> <gray>Nemáš komu odpovědět."
  player-offline: "<prefix_error> <gray>Tento hráč již není online."

# ── Vanish ────────────────────────────────────────────────
vanish:
  enabled:        "<prefix_staff> <gray>Nyní jsi <green><bold>neviditelný</bold></green><gray>."
  disabled:       "<prefix_staff> <gray>Již nejsi neviditelný."
  other-enabled:  "<prefix_staff> <gray>Hráč <green><bold><player></bold></green><gray> byl skryt."
  other-disabled: "<prefix_staff> <gray>Hráč <green><bold><player></bold></green><gray> je opět viditelný."
  notify-on:      "<prefix_staff> <gray>Byl jsi skryt hráčem <green><bold><sender></bold></green><gray>."
  notify-off:     "<prefix_staff> <gray>Byl jsi zviditelněn hráčem <green><bold><sender></bold></green><gray>."

# ── Fly ──────────────────────────────────────────────────
fly:
  enabled:        "<prefix_general> <gray>Létání <green><bold>povoleno</bold></green><gray>."
  disabled:       "<prefix_general> <gray>Létání <green><bold>zakázáno</bold></green><gray>."
  other-enabled:  "<prefix_staff> <gray>Létání povoleno hráči <green><bold><player></bold></green><gray>."
  other-disabled: "<prefix_staff> <gray>Létání zakázáno hráči <green><bold><player></bold></green><gray>."
  notify-on:      "<prefix_general> <gray>Létání bylo <green><bold>povoleno</bold></green> <gray>hráčem <green><bold><sender></bold></green><gray>."
  notify-off:     "<prefix_general> <gray>Létání bylo <green><bold>zakázáno</bold></green> <gray>hráčem <green><bold><sender></bold></green><gray>."

# ── Speed ─────────────────────────────────────────────────
speed:
  set-self:   "<prefix_general> <gray>Rychlost nastavena na <green><bold><speed></bold></green><gray>."
  set-other:  "<prefix_staff> <gray>Rychlost hráče <green><bold><player></bold></green><gray> nastavena na <green><bold><speed></bold></green><gray>."
  notify:     "<prefix_general> <gray>Tvoje rychlost byla nastavena na <green><bold><speed></bold></green> <gray>hráčem <green><bold><sender></bold></green><gray>."
  invalid:    "<prefix_error> <gray>Rychlost musí být mezi <green><bold>0</bold></green> <gray>a <green><bold>10</bold></green><gray>."

# ── Enchant ───────────────────────────────────────────────
enchant:
  success:       "<prefix_staff> <gray>Na tvůj předmět bylo aplikováno <green><bold><enchantment> <level></bold></green><gray>."
  success-other: "<prefix_staff> <gray>Na předmět hráče <green><bold><player></bold></green><gray> bylo aplikováno <green><bold><enchantment> <level></bold></green><gray>."
  invalid:       "<prefix_error> <gray>Neznámý enchant: <green><bold><enchantment></bold></green>"
  no-item:       "<prefix_error> <gray>Musíš držet předmět v ruce."
  invalid-level: "<prefix_error> <gray>Úroveň musí být alespoň <green><bold>1</bold></green><gray>."

# ── Heal ─────────────────────────────────────────────────
heal:
  self:   "<prefix_general> <gray>Byl jsi <green><bold>uzdraven</bold></green><gray>."
  other:  "<prefix_staff> <gray>Hráč <green><bold><player></bold></green><gray> byl uzdraven."
  notify: "<prefix_general> <gray>Byl jsi uzdraven hráčem <green><bold><sender></bold></green><gray>."

# ── Feed ─────────────────────────────────────────────────
feed:
  self:   "<prefix_general> <gray>Byl jsi <green><bold>nakrmen</bold></green><gray>."
  other:  "<prefix_staff> <gray>Hráč <green><bold><player></bold></green><gray> byl nakrmen."
  notify: "<prefix_general> <gray>Byl jsi nakrmen hráčem <green><bold><sender></bold></green><gray>."

# ── God ──────────────────────────────────────────────────
god:
  enabled:        "<prefix_staff> <gray>Boží režim <green><bold>povolen</bold></green><gray>."
  disabled:       "<prefix_staff> <gray>Boží režim <green><bold>zakázán</bold></green><gray>."
  other-enabled:  "<prefix_staff> <gray>Boží režim povolen hráči <green><bold><player></bold></green><gray>."
  other-disabled: "<prefix_staff> <gray>Boží režim zakázán hráči <green><bold><player></bold></green><gray>."
  notify-on:      "<prefix_general> <gray>Boží režim byl <green><bold>povolen</bold></green> <gray>hráčem <green><bold><sender></bold></green><gray>."
  notify-off:     "<prefix_general> <gray>Boží režim byl <green><bold>zakázán</bold></green> <gray>hráčem <green><bold><sender></bold></green><gray>."

# ── InvSee ───────────────────────────────────────────────
invsee:
  opened: "<prefix_staff> <gray>Prohlížíš inventář hráče <green><bold><player></bold></green><gray>."

# ── EnderChest ───────────────────────────────────────────
ec:
