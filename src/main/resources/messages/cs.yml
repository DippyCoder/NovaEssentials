  here-received:     "<prefix_tp> <green><bold><player></bold></green> <gray>chce, abys se teleportoval k nim.\n<prefix_tp> <gray>Použij <green><bold>/tpaccept</bold></green> <gray>nebo <green><bold>/tpdeny</bold></green><gray>."
