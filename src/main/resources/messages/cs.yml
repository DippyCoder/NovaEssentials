  accepted-instant:  "<prefix_tp> <green><bold><player></bold></green> <gray>přijal tvoji žádost."
  denied-sender:     "<prefix_tp> <green><bold><player></bold></green> <gray>odmítl tvoji žádost."
  denied-receiver:   "<prefix_tp> <gray>Žádost o teleportaci od hráče <green><bold><player></bold></green><gray> odmítnuta."
  expired-sender:    "<prefix_tp> <gray>Tvoje žádost hráči <green><bold><player></bold></green> <gray>vypršela."
  expired-receiver:  "<prefix_tp> <gray>Žádost od hráče <green><bold><player></bold></green> <gray>vypršela."
  no-request:        "<prefix_error> <gray>Nemáš žádné čekající žádosti o teleportaci."
  already-pending:   "<prefix_error> <gray>Již máš čekající žádost u hráče <green><bold><player></bold></green><gray>."
  blocked:           "<prefix_error> <gray>Nemůžeš odeslat žádost hráči <green><bold><player></bold></green><gray>."
  cancelled-move:    "<prefix_tp> <gray>Teleportace zrušena, protože ses pohnul."
  teleporting:       "<prefix_tp> <gray>Teleportace za <green><bold><delay>s</bold></green><gray>. Nepohybuj se."

