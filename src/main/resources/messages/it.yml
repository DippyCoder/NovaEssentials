# ── Captcha ───────────────────────────────────────────────
captcha:
  given:            "<prefix_general> <gray>Risolvi il captcha mostrato sulla tua mappa. Digita il codice nella chat."
  issued:           "<prefix_staff> <gray>Captcha inviato a <green><bold><player></bold></green><gray>."
  solved:           "<prefix_general> <gray>Captcha risolto! Sei ora scongelato."
  wrong:            "<prefix_error> <gray>Codice errato. <green><bold><tries></bold></green> <gray>tentativo/i rimanente/i."
  fail-summary:     "<prefix_staff> <green><bold><player></bold></green> <gray>ha fallito il captcha. Il codice era: <green><bold><code></bold></green><gray>. Tentativi falliti: <red><bold><attempts></bold></red>"
  ban-screen:       "<red><bold>Captcha Fallito</bold></red>\n<gray>Motivo: <white>Verifica captcha fallita</white>\n<gray>Bannato da: <green><bold>NovaEssentials</bold></green>"
  dodge-ban-screen: "<red><bold>Sei stato bannato</bold></red>\n<gray>Motivo: <white>Disconnesso per evitare il captcha</white>\n<gray>Bannato da: <green><bold>NovaEssentials</bold></green>"
  no-captcha:       "<prefix_error> <gray>Non hai un captcha attivo."
  already:          "<prefix_error> <gray><green><bold><player></bold></green> <gray>ha già un captcha attivo."
  recaptcha-given:  "<prefix_general> <gray>Nuovo codice captcha emesso. Hai <green><bold><tries></bold></green> <gray>tentativo/i rimanente/i."
  recaptcha-none:   "<prefix_error> <gray>Non hai un captcha attivo da aggiornare."

# ── Repair ────────────────────────────────────────────────
repair:
  repaired:       "<prefix_general> <gray>Il tuo oggetto è stato <green><bold>riparato</bold></green><gray>."
  repaired-other: "<prefix_staff> <gray>Oggetto in mano di <green><bold><player></bold></green><gray> riparato."
  all:            "<prefix_general> <gray>Tutti gli oggetti nel tuo inventario sono stati <green><bold>riparati</bold></green><gray>."
  all-other:      "<prefix_staff> <gray>Tutti gli oggetti nell'inventario di <green><bold><player></bold></green><gray> riparati."
  no-item:        "<prefix_error> <gray>Devi tenere un oggetto danneggiato in mano."
  notify:         "<prefix_general> <gray>Il tuo oggetto in mano è stato riparato da <green><bold><sender></bold></green><gray>."
  notify-all:     "<prefix_general> <gray>Il tuo inventario è stato riparato da <green><bold><sender></bold></green><gray>."

# ── NovaEssentials Admin ─────────────────────────────────
novaess:
  check-enabled:  "<prefix_general> <gray>Controllo automatico degli aggiornamenti <green><bold>abilitato</bold></green><gray>."
  check-disabled: "<prefix_general> <gray>Controllo automatico degli aggiornamenti <green><bold>disabilitato</bold></green><gray>."

# ── Size ─────────────────────────────────────────────────
size:
  tiny:           "<prefix_staff> <gray><green><bold><player></bold></green> <gray>rimpicciolito alla dimensione <green><bold><size></bold></green><gray>."
  giant:          "<prefix_staff> <gray><green><bold><player></bold></green> <gray>ingrandito alla dimensione <green><bold><size></bold></green><gray>."
  reset:          "<prefix_staff> <gray>Dimensione di <green><bold><player></bold></green><gray> ripristinata alla normalità."
  notify:         "<prefix_general> <gray>La tua dimensione è stata impostata su <green><bold><size></bold></green> <gray>da <green><bold><sender></bold></green><gray>."
  notify-reset:   "<prefix_general> <gray>La tua dimensione è stata ripristinata alla normalità da <green><bold><sender></bold></green><gray>."
  not-supported:  "<prefix_error> <gray>La modifica della dimensione non è supportata in questa versione del server."
  invalid:        "<prefix_error> <gray>La dimensione deve essere tra <green><bold>0.0625</bold></green> <gray>e <green><bold>16</bold></green><gray>."

# ── GUI ───────────────────────────────────────────────────
gui:
  kit-title:    "<dark_gray>Kit"
  warp-title:   "<dark_gray>Warp"
  home-title:   "<dark_gray>Le mie Case"
  invsee-title: "<dark_gray>Inventario di <player>"
  prev-page:    "<gray>← Precedente"
  next-page:    "<gray>Successivo →"
  close:        "<red>✗ Chiudi"

tp:
  teleporting:    "<prefix_tp> <gray>Teletrasporto tra <green><bold><delay>s</bold></green><gray>. Non muoverti."
  countdown:      "<yellow>Teletrasporto tra <bold><seconds>s</bold><yellow>..."
  cooldown:       "<prefix_error> <gray>Devi aspettare <green><bold><time>s</bold></green> <gray>prima di teletrasportarti di nuovo."
  cancelled-move: "<prefix_tp> <gray>Teletrasporto annullato perché ti sei mosso."

join:
  message: "<dark_gray>[<green>+</green><dark_gray>] <green><bold><player></bold></green> <gray>è entrato/a nel server."

leave:
  message: "<dark_gray>[<red>-</red><dark_gray>] <green><bold><player></bold></green> <gray>ha lasciato il server."

death:
  messages:
    - "<gray><bold><player></bold></gray><gray> è morto/a."
    - "<gray><bold><player></bold></gray><gray> ha trovato la fine."
    - "<gray><bold><player></bold></gray><gray> ha morso la polvere."
    - "<gray><bold><player></bold></gray><gray> non è sopravvissuto/a."
    - "<gray><bold><player></bold></gray><gray> è stato/a sconfitto/a."
    - "<gray><bold><player></bold></gray><gray> è perito/a."
    - "<gray><bold><player></bold></gray><gray> ha cessato di esistere."
    - "<gray><bold><player></bold></gray><gray> è stato/a eliminato/a."

settings:
  title: "<dark_gray>⚙ Le Tue Impostazioni"
  allow-tpa:
    name: "<white>Richieste TPA"
    lore-on:  "<green>✔ Abilitato <dark_gray>— <gray>I giocatori possono inviarti richieste di TP."
    lore-off: "<red>✘ Disabilitato <dark_gray>— <gray>I giocatori non possono inviarti richieste di TP."
  allow-tpahere:
    name: "<white>Richieste TPA-Qui"
    lore-on:  "<green>✔ Abilitato <dark_gray>— <gray>I giocatori possono chiamarti con /tpahere."
    lore-off: "<red>✘ Disabilitato <dark_gray>— <gray>I giocatori non possono chiamarti con /tpahere."
  tpauto:
    name: "<white>TPA Auto-Accettazione"
    lore-on:  "<green>✔ Abilitato <dark_gray>— <gray>Le richieste TPA vengono auto-accettate."
    lore-off: "<red>✘ Disabilitato <dark_gray>— <gray>Accetti manualmente le richieste TPA."
  language:
    name: "<white>Lingua"
    lore:      "<gray>Attuale: <green><bold><language></bold></green> <dark_gray>— Clicca per cambiare."
    lore-auto: "<gray>Auto <dark_gray>(<gray><language><dark_gray>) <dark_gray>— Clicca per cambiare."
  sounds:
    name: "<white>Suoni GUI"
    lore-on:  "<green>✔ Abilitato <dark_gray>— <gray>I suoni vengono riprodotti nei menu."
    lore-off: "<red>✘ Disabilitato <dark_gray>— <gray>Nessun suono nei menu."
  hide-chat:
    name: "<white>Nascondi Chat"
    lore-on:  "<red>✔ Nascosto <dark_gray>— <gray>I messaggi chat dei giocatori sono nascosti."
    lore-off: "<green>✘ Visibile <dark_gray>— <gray>I messaggi chat dei giocatori sono visibili."
  allow-msg:
    name: "<white>Messaggi Privati"
    lore-on:  "<green>✔ Abilitato <dark_gray>— <gray>I giocatori possono inviarti messaggi."
    lore-off: "<red>✘ Disabilitato <dark_gray>— <gray>I giocatori non possono inviarti messaggi."
  allow-payments:
    name: "<white>Pagamenti"
    lore-on:  "<green>✔ Abilitato <dark_gray>— <gray>I giocatori possono pagarti."
    lore-off: "<red>✘ Disabilitato <dark_gray>— <gray>I giocatori non possono pagarti."
  allow-balance:
    name: "<white>Visibilità del Saldo"
    lore-on:  "<green>✔ Visibile <dark_gray>— <gray>I giocatori possono vedere il tuo saldo."
    lore-off: "<red>✘ Nascosto <dark_gray>— <gray>I giocatori non possono vedere il tuo saldo."
