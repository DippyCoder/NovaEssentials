  unblocked:       "<prefix_general> <gray><green><bold><player></bold></green><gray> sbloccato."
  already-blocked: "<prefix_error> <gray><green><bold><player></bold></green> <gray>è già bloccato."
  not-blocked:     "<prefix_error> <gray><green><bold><player></bold></green> <gray>non è bloccato."
  cannot-self:     "<prefix_error> <gray>Non puoi bloccare te stesso."

# ── Home ─────────────────────────────────────────────────
home:
  teleported:    "<prefix_home> <gray>Teletrasportato alla casa <green><bold><home></bold></green><gray>."
  set:           "<prefix_home> <gray>Casa <green><bold><home></bold></green> <gray>impostata."
  deleted:       "<prefix_home> <gray>Casa <green><bold><home></bold></green> <gray>eliminata."
  not-found:     "<prefix_error> <gray>La casa <green><bold><home></bold></green> <gray>non esiste."
  limit-reached: "<prefix_error> <gray>Hai raggiunto il limite di case (<green><bold><limit></bold></green><gray>)."
