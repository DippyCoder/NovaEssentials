# ============================================================
#   NovaEssentials — Italian Messages  (it.yml)
#
#   All values support full MiniMessage formatting.
#   Tag replacements use <tagname> syntax defined per command.
#   Language translated with Claude
#
#   Prefix tags available in every message:
#     <prefix_general>  <prefix_msg>    <prefix_staff>
#     <prefix_home>     <prefix_warp>   <prefix_tp>
#     <prefix_broadcast><prefix_chat>   <prefix_kit>
#     <prefix_error>
# ============================================================

# ── Prefixes ──────────────────────────────────────────────
prefix:
  general:   "<dark_gray>[<gold>⚡</gold><dark_gray>]"
  msg:       "<dark_gray>[<aqua>✉</aqua><dark_gray>]"
  staff:     "<dark_gray>[<red>🔨</red><dark_gray>]"
  home:      "<dark_gray>[<green>🏠</green><dark_gray>]"
  warp:      "<dark_gray>[<light_purple>🌀</light_purple><dark_gray>]"
  tp:        "<dark_gray>[<yellow>📍</yellow><dark_gray>]"
  broadcast: "<dark_gray>[<aqua>📢</aqua><dark_gray>]"
  chat:      "<dark_gray>[<blue>💬</blue><dark_gray>]"
  kit:       "<dark_gray>[<gold>🎁</gold><dark_gray>]"
  error:     "<dark_gray>[<red>❌</red><dark_gray>]"

# ── General ───────────────────────────────────────────────
general:
  no-permission:    "<prefix_error> <gray>Non hai il permesso per fare questo."
  player-only:      "<prefix_error> <gray>Solo i giocatori possono usare questo comando."
  console-only:     "<prefix_error> <gray>Questo comando può essere usato solo dalla console."
  player-not-found: "<prefix_error> <gray>Il giocatore <green><bold><player></bold></green> <gray>non è stato trovato."
  invalid-args:     "<prefix_error> <gray>Uso: <green><bold><usage></bold></green>"
  command-disabled: "<prefix_error> <gray>Questo comando è attualmente disabilitato."
  invalid-number:   "<prefix_error> <gray><green><bold><value></bold></green> <gray>non è un numero valido."
  reload-success:   "<prefix_general> <gray>Configurazione ricaricata."

# ── Gamemode ──────────────────────────────────────────────
gamemode:
  changed-self:  "<prefix_staff> <gray>La tua modalità di gioco è ora <green><bold><mode></bold></green><gray>."
  changed-other: "<prefix_staff> <gray>Modalità di gioco di <green><bold><player></bold></green><gray> impostata su <green><bold><mode></bold></green><gray>."
  notify:        "<prefix_staff> <gray>La tua modalità di gioco è stata cambiata in <green><bold><mode></bold></green> <gray>da <green><bold><sender></bold></green><gray>."
  invalid-mode:  "<prefix_error> <gray>Modalità non valida <green><bold><mode></bold></green><gray>. Valide: <green><bold>survival, creative, adventure, spectator</bold></green>"

# ── Private Messages ──────────────────────────────────────
msg:
  sent:           "<prefix_msg> <gray>Tu <dark_gray>→ <green><bold><player></bold></green><gray>: <white><italic><message></italic></white>"
  received:       "<prefix_msg> <green><bold><player></bold></green> <dark_gray>→ <gray>Te<gray>: <white><italic><message></italic></white>"
  spy:            "<prefix_msg> <dark_gray>[<gray>SPY<dark_gray>] <green><bold><sender></bold></green> <dark_gray>→ <green><bold><receiver></bold></green><gray>: <italic><message></italic>"
  player-blocked: "<prefix_error> <gray>Non puoi scrivere a <green><bold><player></bold></green><gray>."
  blocked-by:     "<prefix_error> <gray><green><bold><player></bold></green> <gray>non accetta messaggi."
  not-accepting:   "<prefix_error> <gray><green><bold><player></bold></green> <gray>non accetta messaggi."
  no-reply:       "<prefix_error> <gray>Non hai nessuno a cui rispondere."
  player-offline: "<prefix_error> <gray>Quel giocatore non è più online."

# ── Vanish ────────────────────────────────────────────────
vanish:
  enabled:        "<prefix_staff> <gray>Sei ora <green><bold>invisibile</bold></green><gray>."
  disabled:       "<prefix_staff> <gray>Non sei più invisibile."
  other-enabled:  "<prefix_staff> <gray><green><bold><player></bold></green><gray> reso invisibile."
  other-disabled: "<prefix_staff> <gray><green><bold><player></bold></green><gray> reso di nuovo visibile."
  notify-on:      "<prefix_staff> <gray>Sei stato reso invisibile da <green><bold><sender></bold></green><gray>."
  notify-off:     "<prefix_staff> <gray>Sei stato reso di nuovo visibile da <green><bold><sender></bold></green><gray>."

# ── Fly ──────────────────────────────────────────────────
fly:
  enabled:        "<prefix_general> <gray>Volo <green><bold>abilitato</bold></green><gray>."
  disabled:       "<prefix_general> <gray>Volo <green><bold>disabilitato</bold></green><gray>."
  other-enabled:  "<prefix_staff> <gray>Volo abilitato per <green><bold><player></bold></green><gray>."
  other-disabled: "<prefix_staff> <gray>Volo disabilitato per <green><bold><player></bold></green><gray>."
  notify-on:      "<prefix_general> <gray>Il volo è stato <green><bold>abilitato</bold></green> <gray>da <green><bold><sender></bold></green><gray>."
  notify-off:     "<prefix_general> <gray>Il volo è stato <green><bold>disabilitato</bold></green> <gray>da <green><bold><sender></bold></green><gray>."

# ── Speed ─────────────────────────────────────────────────
speed:
  set-self:   "<prefix_general> <gray>Velocità impostata su <green><bold><speed></bold></green><gray>."
  set-other:  "<prefix_staff> <gray>Velocità di <green><bold><player></bold></green><gray> impostata su <green><bold><speed></bold></green><gray>."
  notify:     "<prefix_general> <gray>La tua velocità è stata impostata su <green><bold><speed></bold></green> <gray>da <green><bold><sender></bold></green><gray>."
  invalid:    "<prefix_error> <gray>La velocità deve essere tra <green><bold>0</bold></green> <gray>e <green><bold>10</bold></green><gray>."

# ── Enchant ───────────────────────────────────────────────
enchant:
  success:       "<prefix_staff> <gray>Applicato <green><bold><enchantment> <level></bold></green> <gray>al tuo oggetto."
  success-other: "<prefix_staff> <gray>Applicato <green><bold><enchantment> <level></bold></green> <gray>all'oggetto di <green><bold><player></bold></green><gray>."
  invalid:       "<prefix_error> <gray>Incantesimo sconosciuto: <green><bold><enchantment></bold></green>"
  no-item:       "<prefix_error> <gray>Devi tenere un oggetto in mano."
  invalid-level: "<prefix_error> <gray>Il livello deve essere almeno <green><bold>1</bold></green><gray>."

# ── Heal ─────────────────────────────────────────────────
heal:
  self:   "<prefix_general> <gray>Sei stato <green><bold>curato</bold></green><gray>."
  other:  "<prefix_staff> <gray><green><bold><player></bold></green><gray> curato."
  notify: "<prefix_general> <gray>Sei stato curato da <green><bold><sender></bold></green><gray>."

# ── Feed ─────────────────────────────────────────────────
feed:
  self:   "<prefix_general> <gray>Sei stato <green><bold>sfamato</bold></green><gray>."
  other:  "<prefix_staff> <gray><green><bold><player></bold></green><gray> sfamato."
  notify: "<prefix_general> <gray>Sei stato sfamato da <green><bold><sender></bold></green><gray>."

# ── God ──────────────────────────────────────────────────
god:
  enabled:        "<prefix_staff> <gray>Modalità dio <green><bold>abilitata</bold></green><gray>."
  disabled:       "<prefix_staff> <gray>Modalità dio <green><bold>disabilitata</bold></green><gray>."
  other-enabled:  "<prefix_staff> <gray>Modalità dio abilitata per <green><bold><player></bold></green><gray>."
  other-disabled: "<prefix_staff> <gray>Modalità dio disabilitata per <green><bold><player></bold></green><gray>."
  notify-on:      "<prefix_general> <gray>Modalità dio <green><bold>abilitata</bold></green> <gray>da <green><bold><sender></bold></green><gray>."
  notify-off:     "<prefix_general> <gray>Modalità dio <green><bold>disabilitata</bold></green> <gray>da <green><bold><sender></bold></green><gray>."

# ── InvSee ───────────────────────────────────────────────
invsee:
  opened: "<prefix_staff> <gray>Visualizzazione dell'inventario di <green><bold><player></bold></green><gray>."

# ── EnderChest ───────────────────────────────────────────
ec:
  opened-self:  "<prefix_general> <gray>Il tuo ender chest è stato aperto."
  opened-other: "<prefix_staff> <gray>Visualizzazione dell'ender chest di <green><bold><player></bold></green><gray>."

# ── Workbench ─────────────────────────────────────────────
workbench:
  opened-self:  "<prefix_general> <gray>Tavolo da lavoro aperto."
  opened-other: "<prefix_staff> <gray>Tavolo da lavoro aperto per <green><bold><player></bold></green><gray>."

# ── Anvil ─────────────────────────────────────────────────
anvil:
  opened-self:  "<prefix_general> <gray>Incudine aperta."
  opened-other: "<prefix_staff> <gray>Incudine aperta per <green><bold><player></bold></green><gray>."

# ── TPA ──────────────────────────────────────────────────
tpa:
  sent:              "<prefix_tp> <gray>Richiesta di teletrasporto inviata a <green><bold><player></bold></green><gray>."
  received:          "<prefix_tp> <green><bold><player></bold></green> <gray>vuole teletrasportarsi da te.\n<prefix_tp> <gray>Usa <green><bold>/tpaccept</bold></green> <gray>o <green><bold>/tpdeny</bold></green><gray>."
  here-sent:         "<prefix_tp> <gray>Richiesto a <green><bold><player></bold></green> <gray>di teletrasportarsi da te."
  here-received:     "<prefix_tp> <green><bold><player></bold></green> <gray>vuole che tu ti teletrasporti da loro.\n<prefix_tp> <gray>Usa <green><bold>/tpaccept</bold></green> <gray>o <green><bold>/tpdeny</bold></green><gray>."
  accepted-sender:   "<prefix_tp> <green><bold><player></bold></green> <gray>ha accettato la tua richiesta. Teletrasporto tra <green><bold><delay>s</bold></green><gray>."
  accepted-receiver: "<prefix_tp> <gray>Richiesta di teletrasporto di <green><bold><player></bold></green><gray> accettata."
  accepted-instant:  "<prefix_tp> <green><bold><player></bold></green> <gray>ha accettato la tua richiesta."
  denied-sender:     "<prefix_tp> <green><bold><player></bold></green> <gray>ha rifiutato la tua richiesta."
  denied-receiver:   "<prefix_tp> <gray>Richiesta di teletrasporto di <green><bold><player></bold></green><gray> rifiutata."
  expired-sender:    "<prefix_tp> <gray>La tua richiesta a <green><bold><player></bold></green> <gray>è scaduta."
  expired-receiver:  "<prefix_tp> <gray>La richiesta di <green><bold><player></bold></green> <gray>è scaduta."
  no-request:        "<prefix_error> <gray>Non hai richieste di teletrasporto in sospeso."
  already-pending:   "<prefix_error> <gray>Hai già una richiesta in sospeso con <green><bold><player></bold></green><gray>."
  blocked:           "<prefix_error> <gray>Non puoi inviare una richiesta a <green><bold><player></bold></green><gray>."
  cancelled-move:    "<prefix_tp> <gray>Teletrasporto annullato perché ti sei mosso."
  teleporting:       "<prefix_tp> <gray>Teletrasporto tra <green><bold><delay>s</bold></green><gray>. Non muoverti."
  not-accepting:      "<prefix_error> <gray><green><bold><player></bold></green> <gray>non accetta richieste di teletrasporto."
  not-accepting-here: "<prefix_error> <gray><green><bold><player></bold></green> <gray>non accetta richieste TPA-Qui."
  auto-accepted:      "<prefix_tp> <gray>La tua richiesta è stata accettata automaticamente da <green><bold><player></bold></green><gray>."

# ── TpAll ─────────────────────────────────────────────────
tpall:
  teleported:       "<prefix_staff> <gray><green><bold><count></bold></green> <gray>giocatore/i teletrasportato/i da te."
  notify:           "<prefix_tp> <gray>Sei stato teletrasportato da <green><bold><sender></bold></green><gray>."

# ── Block ─────────────────────────────────────────────────
block:
