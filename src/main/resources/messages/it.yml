  not-muted:               "<prefix_error> <gray><green><bold><player></bold></green> <gray>non è silenziato."
  notify-muted:            "<prefix_staff> <gray>Sei stato silenziato per <green><bold><duration></bold></green> <gray>da <green><bold><sender></bold></green><gray>."
