# ============================================================
#   NovaEssentials — French Messages  (fr.yml)
#
#   All values support full MiniMessage formatting.
#   Tag replacements use <tagname> syntax defined per command.
#   Language translated with Claude
#
#   Prefix tags available in every message:
#     <prefix_general>  <prefix_msg>    <prefix_staff>
#     <prefix_home>     <prefix_warp>   <prefix_tp>
#     <prefix_broadcast><prefix_chat>   <prefix_kit>
#     <prefix_error>
# ============================================================

prefix:
  general:   "<dark_gray>[<gold>⚡</gold><dark_gray>]"
  msg:       "<dark_gray>[<aqua>✉</aqua><dark_gray>]"
  staff:     "<dark_gray>[<red>🔨</red><dark_gray>]"
  home:      "<dark_gray>[<green>🏠</green><dark_gray>]"
  warp:      "<dark_gray>[<light_purple>🌀</light_purple><dark_gray>]"
  tp:        "<dark_gray>[<yellow>📍</yellow><dark_gray>]"
  broadcast: "<dark_gray>[<aqua>📢</aqua><dark_gray>]"
  chat:      "<dark_gray>[<blue>💬</blue><dark_gray>]"
  kit:       "<dark_gray>[<gold>🎁</gold><dark_gray>]"
  error:     "<dark_gray>[<red>❌</red><dark_gray>]"

general:
  no-permission:    "<prefix_error> <gray>Vous n'avez pas la permission de faire cela."
  player-only:      "<prefix_error> <gray>Seuls les joueurs peuvent utiliser cette commande."
  console-only:     "<prefix_error> <gray>Cette commande ne peut être utilisée que depuis la console."
  player-not-found: "<prefix_error> <gray>Le joueur <green><bold><player></bold></green> <gray>est introuvable."
  invalid-args:     "<prefix_error> <gray>Utilisation : <green><bold><usage></bold></green>"
  command-disabled: "<prefix_error> <gray>Cette commande est actuellement désactivée."
  invalid-number:   "<prefix_error> <gray><green><bold><value></bold></green> <gray>n'est pas un nombre valide."
  reload-success:   "<prefix_general> <gray>Configuration rechargée."

gamemode:
  changed-self:  "<prefix_staff> <gray>Votre mode de jeu est maintenant <green><bold><mode></bold></green><gray>."
  changed-other: "<prefix_staff> <gray>Mode de jeu de <green><bold><player></bold></green><gray> défini sur <green><bold><mode></bold></green><gray>."
  notify:        "<prefix_staff> <gray>Votre mode de jeu a été changé en <green><bold><mode></bold></green> <gray>par <green><bold><sender></bold></green><gray>."
  invalid-mode:  "<prefix_error> <gray>Mode de jeu invalide <green><bold><mode></bold></green><gray>. Valides : <green><bold>survival, creative, adventure, spectator</bold></green>"

msg:
  sent:           "<prefix_msg> <gray>Vous <dark_gray>→ <green><bold><player></bold></green><gray> : <white><italic><message></italic></white>"
  received:       "<prefix_msg> <green><bold><player></bold></green> <dark_gray>→ <gray>Vous<gray> : <white><italic><message></italic></white>"
  spy:            "<prefix_msg> <dark_gray>[<gray>SPY<dark_gray>] <green><bold><sender></bold></green> <dark_gray>→ <green><bold><receiver></bold></green><gray> : <italic><message></italic>"
  player-blocked: "<prefix_error> <gray>Vous ne pouvez pas envoyer de message à <green><bold><player></bold></green><gray>."
  blocked-by:     "<prefix_error> <gray><green><bold><player></bold></green> <gray>n'accepte pas les messages."
  no-reply:       "<prefix_error> <gray>Vous n'avez personne à qui répondre."
