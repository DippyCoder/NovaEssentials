# ============================================================
#   NovaEssentials — Polish Messages  (pl.yml)
#
#   All values support full MiniMessage formatting.
#   Tag replacements use <tagname> syntax defined per command.
#   Language translated with Claude
#
#   Prefix tags available in every message:
#     <prefix_general>  <prefix_msg>    <prefix_staff>
#     <prefix_home>     <prefix_warp>   <prefix_tp>
#     <prefix_broadcast><prefix_chat>   <prefix_kit>
#     <prefix_error>
# ============================================================

prefix:
  general:   "<dark_gray>[<gold>⚡</gold><dark_gray>]"
  msg:       "<dark_gray>[<aqua>✉</aqua><dark_gray>]"
  staff:     "<dark_gray>[<red>🔨</red><dark_gray>]"
  home:      "<dark_gray>[<green>🏠</green><dark_gray>]"
  warp:      "<dark_gray>[<light_purple>🌀</light_purple><dark_gray>]"
  tp:        "<dark_gray>[<yellow>📍</yellow><dark_gray>]"
  broadcast: "<dark_gray>[<aqua>📢</aqua><dark_gray>]"
  chat:      "<dark_gray>[<blue>💬</blue><dark_gray>]"
  kit:       "<dark_gray>[<gold>🎁</gold><dark_gray>]"
  error:     "<dark_gray>[<red>❌</red><dark_gray>]"

general:
  no-permission:    "<prefix_error> <gray>Nie masz uprawnień do wykonania tej czynności."
  player-only:      "<prefix_error> <gray>Tej komendy mogą używać tylko gracze."
  console-only:     "<prefix_error> <gray>Ta komenda może być używana tylko z konsoli."
  player-not-found: "<prefix_error> <gray>Gracz <green><bold><player></bold></green> <gray>nie został znaleziony."
  invalid-args:     "<prefix_error> <gray>Użycie: <green><bold><usage></bold></green>"
  command-disabled: "<prefix_error> <gray>Ta komenda jest obecnie wyłączona."
  invalid-number:   "<prefix_error> <gray><green><bold><value></bold></green> <gray>nie jest prawidłową liczbą."
  reload-success:   "<prefix_general> <gray>Konfiguracja przeładowana."

gamemode:
