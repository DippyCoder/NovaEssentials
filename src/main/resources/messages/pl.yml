  changed-other: "<prefix_staff> <gray>Ustawiono tryb gry gracza <green><bold><player></bold></green><gray> na <green><bold><mode></bold></green><gray>."
  notify:        "<prefix_staff> <gray>Twój tryb gry został zmieniony na <green><bold><mode></bold></green> <gray>przez <green><bold><sender></bold></green><gray>."
