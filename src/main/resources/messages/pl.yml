msg:
  sent:           "<prefix_msg> <gray>Ty <dark_gray>→ <green><bold><player></bold></green><gray>: <white><italic><message></italic></white>"
  received:       "<prefix_msg> <green><bold><player></bold></green> <dark_gray>→ <gray>Ty<gray>: <white><italic><message></italic></white>"
  spy:            "<prefix_msg> <dark_gray>[<gray>SPY<dark_gray>] <green><bold><sender></bold></green> <dark_gray>→ <green><bold><receiver></bold></green><gray>: <italic><message></italic>"
  player-blocked: "<prefix_error> <gray>Nie możesz wysłać wiadomości do <green><bold><player></bold></green><gray>."
  blocked-by:     "<prefix_error> <gray><green><bold><player></bold></green> <gray>nie przyjmuje wiadomości."
  not-accepting:   "<prefix_error> <gray><green><bold><player></bold></green> <gray>nie przyjmuje wiadomości."
  no-reply:       "<prefix_error> <gray>Nie masz nikogo, komu możesz odpowiedzieć."
